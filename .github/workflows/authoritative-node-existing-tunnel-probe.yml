name: Node Authoritative Existing Tunnel Probe

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Identify existing cloudflared runtime and network namespace
        shell: bash
        run: |
          set -euo pipefail
          PID="$(pgrep -o cloudflared || true)"
          if [[ -z "${PID}" ]]; then
            echo 'cloudflared_process=missing'
            exit 1
          fi

          echo '=== process ==='
          ps -o pid,ppid,user,group,comm,args -p "${PID}" \
            | sed -E 's/(--token[= ]+)[^ ]+/\1[REDACTED]/g'
          printf 'exe=%s\n' "$(readlink "/proc/${PID}/exe" 2>/dev/null || true)"
          printf 'cwd=%s\n' "$(readlink "/proc/${PID}/cwd" 2>/dev/null || true)"

          echo '=== cgroup ==='
          cat "/proc/${PID}/cgroup" 2>/dev/null || true

          echo '=== host listeners/routes ==='
          ss -H -ltn '( sport = :8080 )' || true
          ip -4 addr show docker0 2>/dev/null || true
          ip -4 route show 2>/dev/null || true

          echo '=== container runtime ==='
          if command -v docker >/dev/null 2>&1; then
            docker ps --no-trunc --format 'id={{.ID}} image={{.Image}} name={{.Names}} ports={{.Ports}}' 2>/dev/null || true
            CONTAINER_ID="$(cat "/proc/${PID}/cgroup" 2>/dev/null | grep -Eo '[0-9a-f]{64}' | head -n 1 || true)"
            if [[ -n "${CONTAINER_ID}" ]]; then
              docker inspect --format 'container_name={{.Name}} image={{.Config.Image}} network_mode={{.HostConfig.NetworkMode}}' "${CONTAINER_ID}" 2>/dev/null || true
              docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}network={{$name}} ip={{$net.IPAddress}} gateway={{$net.Gateway}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true
            fi
          else
            echo 'docker_cli=missing'
          fi

          if command -v podman >/dev/null 2>&1; then
            podman ps --no-trunc --format 'id={{.ID}} image={{.Image}} name={{.Names}} ports={{.Ports}}' 2>/dev/null || true
          fi
