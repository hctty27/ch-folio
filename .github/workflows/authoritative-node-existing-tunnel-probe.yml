name: Node Authoritative Existing Tunnel Probe

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Probe existing cloudflared route without changing host configuration
        shell: bash
        run: |
          set -euo pipefail
          HOSTNAME='hk-test.testnb.me'

          echo '=== DNS ==='
          getent ahosts "${HOSTNAME}" | head -n 12 || true

          echo '=== cloudflared service ==='
          systemctl is-active cloudflared 2>/dev/null || true
          systemctl show cloudflared \
            --property=ActiveState \
            --property=SubState \
            --property=FragmentPath \
            --no-pager 2>/dev/null || true

          echo '=== cloudflared processes (tokens redacted) ==='
          pgrep -af cloudflared 2>/dev/null \
            | sed -E 's/(--token[= ]+)[^ ]+/\1[REDACTED]/g; s/(TUNNEL_TOKEN=)[^ ]+/\1[REDACTED]/g' \
            || true

          echo '=== readable tunnel route hints ==='
          for config in \
            /etc/cloudflared/config.yml \
            /etc/cloudflared/config.yaml \
            /home/github-runner/.cloudflared/config.yml \
            /home/github-runner/.cloudflared/config.yaml
          do
            if [[ -r "${config}" ]]; then
              echo "config=${config}"
              grep -E '^[[:space:]]*(-[[:space:]]+)?(hostname|service|url|tunnel):' "${config}" \
                | sed -E 's/(token:[[:space:]]*).*/\1[REDACTED]/I' \
                || true
            fi
          done

          echo '=== public root before marker ==='
          curl --silent --show-error --connect-timeout 5 --max-time 10 \
            --output "${RUNNER_TEMP}/hk-test-root-before.txt" \
            --write-out 'http=%{http_code} remote=%{remote_ip}\n' \
            "https://${HOSTNAME}/" || true
          head -c 500 "${RUNNER_TEMP}/hk-test-root-before.txt" 2>/dev/null || true
          echo

          if ss -H -ltn '( sport = :8080 )' | grep -q .; then
            echo 'port_8080=occupied'
            echo '=== loopback healthz ==='
            curl --silent --show-error --connect-timeout 2 --max-time 5 \
              --write-out '\nhttp=%{http_code}\n' \
              http://127.0.0.1:8080/healthz || true
            echo '=== public healthz ==='
            curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --write-out '\nhttp=%{http_code}\n' \
              "https://${HOSTNAME}/healthz" || true
            exit 0
          fi

          echo 'port_8080=free; starting temporary marker server'
          MARKER='hk-test-existing-tunnel-marker-20260807'
          MARKER="${MARKER}" python3 - <<'PY' >"${RUNNER_TEMP}/hk-test-marker.log" 2>&1 &
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          marker = os.environ['MARKER']

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  payload = json.dumps({'marker': marker, 'path': self.path}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, fmt, *args):
                  pass

          ThreadingHTTPServer(('127.0.0.1', 8080), Handler).serve_forever()
          PY
          MARKER_PID=$!
          cleanup() {
            kill "${MARKER_PID}" 2>/dev/null || true
            wait "${MARKER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep -q "${MARKER}"; then
              break
            fi
            sleep 0.25
          done

          echo '=== public healthz through existing Tunnel ==='
          matched=0
          for attempt in $(seq 1 40); do
            body="$(curl --silent --show-error --connect-timeout 5 --max-time 10 "https://${HOSTNAME}/healthz" || true)"
            if [[ "${body}" == *"${MARKER}"* ]]; then
              echo "${body}"
              matched=1
              break
            fi
            if (( attempt == 1 || attempt == 10 || attempt == 20 || attempt == 40 )); then
              printf 'attempt=%s body=%s\n' "${attempt}" "${body:0:300}"
            fi
            sleep 0.5
          done

          echo "existing_tunnel_routes_hostname_to_127.0.0.1:8080=${matched}"
          if [[ "${matched}" -ne 1 ]]; then
            exit 2
          fi
