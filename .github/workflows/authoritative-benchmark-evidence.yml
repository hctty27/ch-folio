name: Authoritative Benchmark Evidence

on:
  push:
    branches:
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run 36000-tick local benchmark
        shell: bash
        run: |
          set +e
          npm run benchmark:authoritative:local -- --output=authoritative-local-benchmark.json
          status=$?
          printf '{"exitCode":%s}\n' "$status" > authoritative-local-benchmark-status.json
          exit 0
      - name: Probe Cloudflare authentication without exposing account details
        shell: bash
        run: |
          npm install --prefix multiplayer-worker --ignore-scripts
          if (cd multiplayer-worker && npx wrangler whoami >/tmp/authoritative-wrangler-whoami.log 2>&1); then
            printf '{"authenticated":true}\n' > cloudflare-auth-status.json
          else
            printf '{"authenticated":false}\n' > cloudflare-auth-status.json
          fi
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: task-18-authoritative-benchmark-evidence
          path: |
            authoritative-local-benchmark.json
            authoritative-local-benchmark-status.json
            cloudflare-auth-status.json
          if-no-files-found: error
          retention-days: 1
