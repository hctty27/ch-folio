name: Task 7 Prepare Node Rapier Adapter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-node-rapier:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/authoritative-physics-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-physics-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --save-dev --save-exact "@dimforge/rapier3d-node@npm:@dimforge/rapier3d-deterministic-compat@0.17.3"
      - name: Use Node-compatible deterministic Rapier in the shared test
        run: sed -i "s#@dimforge/rapier3d/rapier.js#@dimforge/rapier3d-node#" packages/authoritative-physics/test/world.test.mjs
      - name: Commit Node test adapter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json packages/authoritative-physics/test/world.test.mjs
          if git diff --cached --quiet; then
            echo "Node Rapier adapter is already current"
            exit 0
          fi
          git commit -m "test: add Node adapter for deterministic Rapier"
          git push origin HEAD:feat/authoritative-physics-foundation
