name: Repair Rapier alias lock nodes

on:
  push:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-physics-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove stale alias nodes only
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'
          for(const path of [ 'package-lock.json', 'multiplayer-worker/package-lock.json' ])
          {
              const lock = JSON.parse(readFileSync(path, 'utf8'))
              delete lock.packages['node_modules/@dimforge/rapier3d']
              writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          }
          EOF
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix multiplayer-worker --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify corrected tarballs
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          for(const path of [ 'package-lock.json', 'multiplayer-worker/package-lock.json' ])
          {
              const lock = JSON.parse(readFileSync(path, 'utf8'))
              const node = lock.packages['node_modules/@dimforge/rapier3d']
              if(!node?.resolved?.includes('rapier3d-deterministic-compat'))
                  throw new Error(`${path} still has stale Rapier node: ${JSON.stringify(node)}`)
          }
          EOF
      - name: Commit repaired locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json multiplayer-worker/package-lock.json
          git commit -m "build: repair deterministic compat Rapier lock nodes"
          git push origin HEAD:feat/authoritative-physics-foundation
