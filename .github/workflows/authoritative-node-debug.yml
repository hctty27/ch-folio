name: Node Authoritative Debug

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

jobs:
  node-debug:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix authoritative-node --ignore-scripts
      - name: Run Node suite with diagnostic timeout
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 30s npm test --prefix authoritative-node
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "=== Node suite timed out; active processes ==="
            ps -eo pid,ppid,stat,etime,cmd | grep -E 'node|npm|authoritative' || true
          fi
          exit "$status"
