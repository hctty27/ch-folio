name: Node Benchmark Warmup Repeat Debug

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

concurrency:
  group: node-authoritative-warmup-repeat-debug-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record warmup environment
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "nproc=$(nproc)"
            echo "=== uptime ==="
            uptime
            echo "=== cpu pressure ==="
            cat /proc/pressure/cpu 2>/dev/null || true
          } > authoritative-node-warmup-repeat-environment.txt
      - name: Run process warmup then two fresh 36000-tick worlds
        id: diagnostic
        shell: bash
        run: |
          set +e
          node --input-type=module > authoritative-node-warmup-repeat.log 2>&1 <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import { runLocalBenchmark } from './scripts/benchmark-authoritative-room.mjs'

          const warmupTicks = 6_000
          const warmup = await runLocalBenchmark({ ticks: warmupTicks })
          const runMeasured = () => runLocalBenchmark({
              ticks: 36_000,
              diagnostics: true,
              slowTickThresholdMs: 5,
          })
          const first = await runMeasured()
          const second = await runMeasured()

          first.diagnostics.processWarmupTicks = warmupTicks
          first.diagnostics.measurementOrdinal = 1
          second.diagnostics.processWarmupTicks = warmupTicks
          second.diagnostics.measurementOrdinal = 2

          await writeFile(
              'authoritative-node-warmed-first.json',
              `${JSON.stringify(first, null, 2)}\n`,
          )
          await writeFile(
              'authoritative-node-warmed-second.json',
              `${JSON.stringify(second, null, 2)}\n`,
          )
          process.stdout.write(`${JSON.stringify({
              warmup: warmup.phases.totalTick,
              first: {
                  totalTick: first.phases.totalTick,
                  rapierStep: first.phases.rapierStep,
                  gates: first.gates,
              },
              second: {
                  totalTick: second.phases.totalTick,
                  rapierStep: second.phases.rapierStep,
                  gates: second.gates,
              },
          }, null, 2)}\n`)
          process.exitCode = first.gates.pass && second.gates.pass ? 0 : 1
          NODE
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload repeat diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-warmup-repeat-debug
          path: |
            authoritative-node-warmed-first.json
            authoritative-node-warmed-second.json
            authoritative-node-warmup-repeat.log
            authoritative-node-warmup-repeat-environment.txt
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic gate status
        shell: bash
        run: echo "repeat_benchmark_exit_status=${{ steps.diagnostic.outputs.status }}"
