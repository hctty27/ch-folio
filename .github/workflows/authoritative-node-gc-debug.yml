name: Node Benchmark Scheduler Debug

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

concurrency:
  group: node-authoritative-scheduler-debug-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record scheduler environment
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "nproc=$(nproc)"
            echo "taskset=$(command -v taskset || true)"
            echo "vmstat=$(command -v vmstat || true)"
            echo "=== uname ==="
            uname -a
            echo "=== uptime ==="
            uptime
            echo "=== lscpu ==="
            lscpu
            echo "=== memory ==="
            free -m || true
            echo "=== cpu pressure ==="
            cat /proc/pressure/cpu 2>/dev/null || true
          } > authoritative-node-scheduler-environment.txt
      - name: Compare baseline and CPU-pinned 36000-tick diagnostics
        id: diagnostic
        shell: bash
        run: |
          set +e
          if command -v vmstat >/dev/null 2>&1; then
            vmstat 1 > authoritative-node-vmstat.log &
            VMSTAT_PID=$!
          else
            VMSTAT_PID=""
            : > authoritative-node-vmstat.log
          fi
          trap 'if [ -n "$VMSTAT_PID" ]; then kill "$VMSTAT_PID" 2>/dev/null || true; fi' EXIT

          node scripts/benchmark-authoritative-room.mjs \
            --diagnostics \
            --slow-tick-threshold-ms=5 \
            --output=authoritative-node-baseline-diagnostic.json \
            > authoritative-node-baseline.log 2>&1
          baseline_status=$?

          sleep 2

          taskset -c 1 node scripts/benchmark-authoritative-room.mjs \
            --diagnostics \
            --slow-tick-threshold-ms=5 \
            --output=authoritative-node-pinned-diagnostic.json \
            > authoritative-node-pinned.log 2>&1
          pinned_status=$?

          echo "baseline_status=${baseline_status}" >> "$GITHUB_OUTPUT"
          echo "pinned_status=${pinned_status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload scheduler diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-scheduler-debug
          path: |
            authoritative-node-baseline-diagnostic.json
            authoritative-node-pinned-diagnostic.json
            authoritative-node-baseline.log
            authoritative-node-pinned.log
            authoritative-node-vmstat.log
            authoritative-node-scheduler-environment.txt
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic gate status
        shell: bash
        run: |
          echo "baseline_exit_status=${{ steps.diagnostic.outputs.baseline_status }}"
          echo "pinned_exit_status=${{ steps.diagnostic.outputs.pinned_status }}"
