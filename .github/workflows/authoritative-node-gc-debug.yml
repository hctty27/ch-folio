name: Node Benchmark Warmup Debug

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

concurrency:
  group: node-authoritative-warmup-debug-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record warmup environment
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "nproc=$(nproc)"
            echo "=== uptime ==="
            uptime
            echo "=== cpu pressure ==="
            cat /proc/pressure/cpu 2>/dev/null || true
          } > authoritative-node-warmup-environment.txt
      - name: Run 6000-tick process warmup then measured 36000 ticks
        id: diagnostic
        shell: bash
        run: |
          set +e
          if command -v vmstat >/dev/null 2>&1; then
            vmstat 1 > authoritative-node-warmup-vmstat.log &
            VMSTAT_PID=$!
          else
            VMSTAT_PID=""
            : > authoritative-node-warmup-vmstat.log
          fi
          trap 'if [ -n "$VMSTAT_PID" ]; then kill "$VMSTAT_PID" 2>/dev/null || true; fi' EXIT

          node --input-type=module > authoritative-node-warmup.log 2>&1 <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import { runLocalBenchmark } from './scripts/benchmark-authoritative-room.mjs'

          const warmupTicks = 6_000
          const warmup = await runLocalBenchmark({ ticks: warmupTicks })
          const report = await runLocalBenchmark({
              ticks: 36_000,
              diagnostics: true,
              slowTickThresholdMs: 5,
          })
          report.diagnostics.processWarmupTicks = warmupTicks
          report.diagnostics.warmupGate = warmup.gates
          await writeFile(
              'authoritative-node-warmed-diagnostic.json',
              `${JSON.stringify(report, null, 2)}\n`,
          )
          process.stdout.write(`${JSON.stringify({
              warmup: warmup.phases.totalTick,
              measured: report.phases.totalTick,
              gates: report.gates,
          }, null, 2)}\n`)
          process.exitCode = report.gates.pass ? 0 : 1
          NODE
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload warmup diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-warmup-debug
          path: |
            authoritative-node-warmed-diagnostic.json
            authoritative-node-warmup.log
            authoritative-node-warmup-vmstat.log
            authoritative-node-warmup-environment.txt
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic gate status
        shell: bash
        run: echo "warmed_benchmark_exit_status=${{ steps.diagnostic.outputs.status }}"
