name: Node Authoritative Host Probe

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe staging host without mutation
        shell: bash
        run: |
          set -u
          echo "commit=$(git rev-parse HEAD)"
          echo "user=$(id -un)"
          echo "node=$(node --version 2>/dev/null || echo missing)"
          echo "npm=$(npm --version 2>/dev/null || echo missing)"
          echo "cloudflared=$(command -v cloudflared || echo missing)"
          if command -v cloudflared >/dev/null 2>&1; then
            cloudflared --version || true
          fi
          echo "rsync=$(command -v rsync || echo missing)"
          echo "openssl=$(command -v openssl || echo missing)"
          echo "curl=$(command -v curl || echo missing)"
          echo "systemctl=$(command -v systemctl || echo missing)"
          if sudo -n true 2>/dev/null; then
            echo "sudo_noninteractive=yes"
          else
            echo "sudo_noninteractive=no"
          fi

          echo "=== service states ==="
          systemctl show cloudflared.service \
            -p LoadState -p ActiveState -p SubState -p FragmentPath --no-pager 2>/dev/null || true
          systemctl show ch-folio-authoritative-node.service \
            -p LoadState -p ActiveState -p SubState -p FragmentPath --no-pager 2>/dev/null || true

          echo "=== port 8080 ==="
          ss -ltnH 2>/dev/null | awk '$4 ~ /:8080$/ {print "occupied=" $4}' || true

          echo "=== cloudflared local state ==="
          [[ -f "$HOME/.cloudflared/cert.pem" ]] && echo "user_cert=yes" || echo "user_cert=no"
          [[ -f "$HOME/.cloudflared/config.yml" ]] && echo "user_config=yes" || echo "user_config=no"
          if sudo -n true 2>/dev/null; then
            sudo -n test -f /root/.cloudflared/cert.pem && echo "root_cert=yes" || echo "root_cert=no"
            sudo -n test -f /etc/cloudflared/config.yml && echo "etc_default_config=yes" || echo "etc_default_config=no"
            sudo -n test -f /etc/cloudflared/ch-folio-authoritative-staging.yml && echo "staging_config=yes" || echo "staging_config=no"
            echo "cloudflared_files_begin"
            sudo -n find /etc/cloudflared -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
            echo "cloudflared_files_end"
          fi

          echo "=== install state ==="
          [[ -d /opt/ch-folio-authoritative-staging ]] && echo "install_root=yes" || echo "install_root=no"
          [[ -f /etc/ch-folio-authoritative-staging.env ]] && echo "secret_env=yes" || echo "secret_env=no"

          echo "=== named tunnel visibility ==="
          if command -v cloudflared >/dev/null 2>&1; then
            timeout 15 cloudflared tunnel list --output json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);for(const t of a)console.log(JSON.stringify({id:t.id,name:t.name,status:t.status??null}))}catch{console.log('user_tunnel_list=unavailable')}})" \
              || echo "user_tunnel_list=unavailable"
          fi
