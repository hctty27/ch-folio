name: Task 6 Generate Authoritative Map

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-map:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/authoritative-physics-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-physics-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:authoritative-map
      - name: Commit generated map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/authoritative-physics/generated/map-v1.json
          if git diff --cached --quiet; then
            echo "Generated map is already current"
            exit 0
          fi
          git commit -m "chore: generate authoritative map v1"
          git push origin HEAD:feat/authoritative-physics-foundation
