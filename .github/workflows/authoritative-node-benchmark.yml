name: Node Authoritative Benchmark Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: false
  queue: max

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix authoritative-node --ignore-scripts
      - run: npm run test:authoritative-benchmark
      - name: Record evidence identity
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > authoritative-node-benchmark-identity.txt
      - name: Run 36000-tick hard gate
        id: benchmark
        shell: bash
        run: |
          set +e
          npm run benchmark:authoritative:local -- \
            --output=authoritative-node-local-benchmark.json
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-local-benchmark
          path: |
            authoritative-node-local-benchmark.json
            authoritative-node-benchmark-identity.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce benchmark hard gate
        shell: bash
        run: exit "${{ steps.benchmark.outputs.status }}"
