name: Node Authoritative Named Staging Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hk-server-named-staging-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - run: echo "cancel stale temporary named-staging run"
