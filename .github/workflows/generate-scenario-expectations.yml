name: Generate Scenario Expectations

on:
  push:
    branches:
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-physics-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate deterministic fixture expectations
        run: |
          env -u CI -u GITHUB_ACTIONS UPDATE_EXPECTED=1 node --input-type=module <<'NODE'
          import { loadRapierForNode } from './packages/authoritative-physics/test/loadRapierForNode.mjs'
          import { scenarioFixtures } from './packages/authoritative-physics/test/scenarioCatalog.js'
          import { updateScenarioExpectations } from './packages/authoritative-physics/test/scenarioUpdater.mjs'

          const RAPIER = await loadRapierForNode()
          await updateScenarioExpectations({ RAPIER, fixtures: scenarioFixtures })
          NODE
      - name: Commit generated fixtures
        run: |
          if git diff --quiet -- packages/authoritative-physics/test/fixtures; then
            echo "fixture expectations are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/authoritative-physics/test/fixtures/*.json
          git commit -m "test: freeze deterministic authoritative scenario expectations"
          git push origin HEAD:feat/authoritative-physics-foundation
      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: task-17-scenario-expectations
          path: packages/authoritative-physics/test/fixtures/*.json
          if-no-files-found: error
          retention-days: 1
