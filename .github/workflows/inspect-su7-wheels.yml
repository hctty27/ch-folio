name: Inspect SU7 wheels

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/inspect_su7_wheel_asset.mjs'
      - 'static/vehicle/default.glb'
      - '.github/workflows/inspect-su7-wheels.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect GLB wheel hierarchy
        run: node scripts/inspect_su7_wheel_asset.mjs static/vehicle/default.glb
