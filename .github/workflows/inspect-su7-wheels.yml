name: Verify SU7 four wheels

on:
  push:
    branches: [ main ]
    paths:
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-su7-four-wheels.mjs'
      - 'scripts/su7-four-wheel-glb.mjs'
      - 'scripts/test_su7_*.mjs'
      - 'scripts/convert_su7.py'
      - 'scripts/test_convert_su7.py'
      - 'sources/Game/World/SU7*.js'
      - 'sources/index.js'
      - '.github/workflows/inspect-su7-wheels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-su7.txt
      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements-su7.txt
          npm clean-install --progress=false
      - name: Test, build, and inspect
        shell: bash
        run: |
          set +e
          mkdir -p docs/diagnostics
          report=docs/diagnostics/su7-wheel-runtime-position-regression.txt
          : > "$report"
          status=0

          run_and_record() {
            echo >> "$report"
            echo "### $*" | tee -a "$report"
            "$@" 2>&1 | tee -a "$report"
            code=${PIPESTATUS[0]}
            echo "exit=$code" | tee -a "$report"
            if [ "$code" -ne 0 ]; then
              status="$code"
            fi
          }

          run_and_record npm run test:wheels
          run_and_record npm test
          run_and_record npm run build
          run_and_record node scripts/inspect_su7_wheel_asset.mjs static/vehicle/default.glb
          echo "overall_exit=$status" | tee -a "$report"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m "chore: record verified SU7 runtime wheelbase fix" || true
          git push || true
          exit "$status"
