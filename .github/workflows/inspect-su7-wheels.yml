name: Verify SU7 four wheels

on:
  push:
    branches: [ main ]
    paths:
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-su7-four-wheels.mjs'
      - 'scripts/su7-four-wheel-glb.mjs'
      - 'scripts/test_su7_*.mjs'
      - 'scripts/convert_su7.py'
      - 'scripts/test_convert_su7.py'
      - 'sources/Game/World/SU7*.js'
      - 'sources/index.js'
      - '.github/workflows/inspect-su7-wheels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-su7.txt
      - name: Test, build, and inspect
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p docs/diagnostics
          report=docs/diagnostics/su7-four-wheel-verification.txt
          : > "$report"
          status=0

          run_and_record() {
            echo >> "$report"
            echo "### $*" | tee -a "$report"
            "$@" 2>&1 | tee -a "$report"
            code=${PIPESTATUS[0]}
            echo "exit=$code" | tee -a "$report"
            if [ "$code" -ne 0 ]; then
              status="$code"
            fi
          }

          {
            echo "commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "python=$(python --version 2>&1)"
          } | tee -a "$report"

          run_and_record python -m pip install -r scripts/requirements-su7.txt
          run_and_record npm clean-install --progress=false
          run_and_record npm test
          run_and_record npm run build
          run_and_record node scripts/inspect_su7_wheel_asset.mjs static/vehicle/default.glb

          echo "overall_exit=$status" | tee -a "$report"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verification
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/diagnostics/su7-four-wheel-verification.txt
          git commit -m "chore: record SU7 four-wheel verification" || exit 0
          git push
      - name: Fail when verification failed
        if: steps.verify.outputs.status != '0'
        run: exit "${{ steps.verify.outputs.status }}"
