name: Inspect SU7 wheels

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/inspect_su7_wheel_asset.mjs'
      - 'static/vehicle/default.glb'
      - '.github/workflows/inspect-su7-wheels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect GLB wheel hierarchy
        run: |
          mkdir -p docs/diagnostics
          node scripts/inspect_su7_wheel_asset.mjs static/vehicle/default.glb > docs/diagnostics/su7-wheel-hierarchy.txt
          cat docs/diagnostics/su7-wheel-hierarchy.txt
      - name: Persist diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/diagnostics/su7-wheel-hierarchy.txt
          git commit -m "chore: record SU7 wheel hierarchy" || exit 0
          git push
