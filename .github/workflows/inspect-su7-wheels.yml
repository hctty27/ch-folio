name: Verify SU7 four wheels

on:
  push:
    branches: [ main ]
    paths:
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/materialize-vehicle.js'
      - 'scripts/convert_su7.py'
      - 'scripts/test_su7_*.mjs'
      - 'scripts/test_convert_su7.py'
      - 'scripts/requirements-su7.txt'
      - 'sources/Game/World/SU7*.js'
      - 'sources/index.js'
      - 'static/vehicle/su7-original-four-wheel/**'
      - '.github/workflows/inspect-su7-wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-su7.txt
      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements-su7.txt
      - name: Install Node dependencies
        run: npm clean-install --progress=false
      - name: Materialize original four-wheel SU7 asset
        run: npm run materialize:vehicle
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Inspect transformed wheel hierarchy
        run: node scripts/inspect_su7_wheel_asset.mjs static/vehicle/default.glb
