name: Node Authoritative Host Bind Probe

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Verify 0.0.0.0:8080 reaches hk-test through existing Tunnel
        shell: bash
        run: |
          set -euo pipefail
          HOSTNAME='hk-test.testnb.me'
          MARKER='hk-test-host-bind-marker-20260807'

          if ss -H -ltn '( sport = :8080 )' | grep -q .; then
            echo 'port 8080 is occupied; refusing to disturb existing service' >&2
            exit 1
          fi

          MARKER="${MARKER}" python3 - <<'PY' >"${RUNNER_TEMP}/host-bind-marker.log" 2>&1 &
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          marker = os.environ['MARKER']

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  payload = json.dumps({'marker': marker, 'path': self.path}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, fmt, *args):
                  pass

          ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          PY
          MARKER_PID=$!
          cleanup() {
            kill "${MARKER_PID}" 2>/dev/null || true
            wait "${MARKER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep -q "${MARKER}"; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo 'marker did not become locally healthy' >&2
            exit 1
          fi

          echo '=== host listeners ==='
          ss -H -ltnp '( sport = :8080 )' || true

          echo '=== direct Docker bridge gateway ==='
          curl --silent --show-error --connect-timeout 2 --max-time 5 \
            --write-out '\nhttp=%{http_code}\n' \
            http://172.18.0.1:8080/healthz || true

          echo '=== public Tunnel ==='
          matched=0
          for attempt in $(seq 1 40); do
            body="$(curl --silent --show-error --connect-timeout 5 --max-time 10 "https://${HOSTNAME}/healthz" || true)"
            if [[ "${body}" == *"${MARKER}"* ]]; then
              echo "${body}"
              matched=1
              break
            fi
            if (( attempt == 1 || attempt == 10 || attempt == 20 || attempt == 40 )); then
              printf 'attempt=%s body=%s\n' "${attempt}" "${body:0:300}"
            fi
            sleep 0.5
          done

          echo "public_tunnel_reaches_0.0.0.0_8080=${matched}"
          if [[ "${matched}" -ne 1 ]]; then
            exit 2
          fi
