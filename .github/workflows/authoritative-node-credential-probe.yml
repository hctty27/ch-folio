name: Node Authoritative Credential Probe

on:
  pull_request:
    branches:
      - feat/authoritative-physics-foundation

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    steps:
      - name: Report credential presence only
        shell: bash
        env:
          HAS_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_TUNNEL_TOKEN: ${{ secrets.AUTHORITATIVE_STAGING_TUNNEL_TOKEN != '' }}
          HAS_HOSTNAME_SECRET: ${{ secrets.AUTHORITATIVE_STAGING_HOSTNAME != '' }}
          HAS_CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_HOSTNAME_VAR: ${{ vars.AUTHORITATIVE_STAGING_HOSTNAME != '' }}
          HAS_TUNNEL_ID_VAR: ${{ vars.AUTHORITATIVE_STAGING_TUNNEL_ID != '' }}
        run: |
          printf '%s\n' \
            "cloudflare_api_token=${HAS_CF_API_TOKEN}" \
            "cloudflare_account_secret=${HAS_CF_ACCOUNT_SECRET}" \
            "cloudflare_account_var=${HAS_CF_ACCOUNT_VAR}" \
            "named_tunnel_token=${HAS_TUNNEL_TOKEN}" \
            "staging_hostname_secret=${HAS_HOSTNAME_SECRET}" \
            "staging_hostname_var=${HAS_HOSTNAME_VAR}" \
            "staging_tunnel_id_var=${HAS_TUNNEL_ID_VAR}"
