name: Verify

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test packages/authoritative-physics/test/*.test.mjs
      - name: Reject deterministic expectation updates in CI
        run: |
          if UPDATE_EXPECTED=1 npm run test:authoritative-scenarios; then
            echo "scenario updater unexpectedly succeeded in CI"
            exit 1
          fi
      - run: python -m pip install numpy trimesh
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix authoritative-node --ignore-scripts
      - run: npm test --prefix authoritative-node
      - run: npm install --prefix multiplayer-worker --ignore-scripts
      - run: npm test --prefix multiplayer-worker
      - run: npm run check --prefix multiplayer-worker
      - run: cd multiplayer-worker && npx wrangler deploy --dry-run
