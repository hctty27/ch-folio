name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact implementation head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin design/server-tick-aligned-prediction
          test "$(git rev-parse origin/design/server-tick-aligned-prediction)" = "4c8054d889c212509c0841052001de40d934889a"
          git checkout --detach 4c8054d889c212509c0841052001de40d934889a
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Record memory before build
        shell: bash
        run: |
          free -h
          cat /proc/meminfo | grep -E 'MemAvailable|SwapFree|SwapTotal'
      - name: Run production build with RSS evidence
        shell: bash
        run: /usr/bin/time -v npm run build
