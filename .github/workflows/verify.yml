name: Verify

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install numpy trimesh
      - run: npm test
      - run: npm run build
      - run: npm install --prefix multiplayer-worker --ignore-scripts
      - name: Commit generated Worker lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/worker-lockfile'
        run: |
          if git status --porcelain -- multiplayer-worker/package-lock.json | grep -q .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add multiplayer-worker/package-lock.json
            git commit -m "fix: add Worker dependency lockfile"
            git push origin HEAD:feat/worker-lockfile
          fi
      - run: npm test --prefix multiplayer-worker
      - run: npm run check --prefix multiplayer-worker
