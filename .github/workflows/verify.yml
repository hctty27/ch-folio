name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout server-tick prediction implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin design/server-tick-aligned-prediction
          git checkout --detach origin/design/server-tick-aligned-prediction
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install validation dependencies
        run: |
          npm ci
          npm ci --prefix authoritative-node --ignore-scripts
      - name: Run hosted load command timeline regression
        run: node --test scripts/test_authoritative_node_loadtest.mjs
      - name: Run 8-client 30-second aligned loopback load
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          LOG="${RUNNER_TEMP}/aligned-load-node.log"

          HOST=127.0.0.1 \
          PORT=18080 \
          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
          node authoritative-node/src/index.js >"${LOG}" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              cat "${LOG}" >&2
              exit 1
            fi
            sleep 0.25
          done
          test "${ready}" -eq 1

          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
          AUTHORITATIVE_BENCHMARK_COMMIT="$(git rev-parse HEAD)" \
            node scripts/loadtest-authoritative-node.mjs \
              --url=ws://127.0.0.1:18080/ws \
              --room=aligned-loopback-30s \
              --clients=8 \
              --seconds=30 \
            | tee authoritative-node-aligned-loopback-30s.json
      - name: Upload aligned loopback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-aligned-loopback-30s
          path: authoritative-node-aligned-loopback-30s.json
          if-no-files-found: error
          retention-days: 30
