name: Verify

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test packages/authoritative-physics/test/versions.test.mjs
      - run: python -m pip install numpy trimesh
      - run: npm test
      - run: npm run build
      - run: npm install --prefix multiplayer-worker --ignore-scripts
      - name: Diagnose Worker Rapier package resolution
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync, readdirSync } from 'node:fs'
          const root = 'multiplayer-worker/node_modules/@dimforge/rapier3d'
          const lock = JSON.parse(readFileSync('multiplayer-worker/package-lock.json', 'utf8'))
          console.log('lock node=', lock.packages['node_modules/@dimforge/rapier3d'])
          console.log('installed package=', readFileSync(`${root}/package.json`, 'utf8'))
          console.log('files=', readdirSync(root).sort())
          console.log('wasm exists=', existsSync(`${root}/rapier_wasm3d_bg.wasm`))
          EOF
          npm view @dimforge/rapier3d-deterministic-compat@0.17.3 dist.tarball dist.integrity
      - run: npm test --prefix multiplayer-worker
      - run: npm run check --prefix multiplayer-worker
