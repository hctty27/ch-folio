name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-remainder-validation
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact implementation head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin design/server-tick-aligned-prediction
          test "$(git rev-parse origin/design/server-tick-aligned-prediction)" = "4c8054d889c212509c0841052001de40d934889a"
          git checkout --detach 4c8054d889c212509c0841052001de40d934889a
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run authoritative Node suite
        run: |
          npm ci --prefix authoritative-node --ignore-scripts
          npm test --prefix authoritative-node
      - name: Run multiplayer Worker suite and dry-run
        run: |
          npm install --prefix multiplayer-worker --ignore-scripts
          npm test --prefix multiplayer-worker
          npm run check --prefix multiplayer-worker
          cd multiplayer-worker
          npx wrangler deploy --dry-run
