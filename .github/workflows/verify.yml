name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Purge stale Rapier test sandboxes
        shell: bash
        run: |
          set -euo pipefail
          TEMP_ROOT="${TMPDIR:-/tmp}"
          find "${TEMP_ROOT}" -maxdepth 1 -type d -name 'ch-folio-rapier-*' -user "$(id -un)" -exec rm -rf -- {} +
          df -h "${TEMP_ROOT}"
      - run: npm ci
      - run: node --test packages/authoritative-physics/test/*.test.mjs
      - name: Reject deterministic expectation updates in CI
        run: |
          if UPDATE_EXPECTED=1 npm run test:authoritative-scenarios; then
            echo "scenario updater unexpectedly succeeded in CI"
            exit 1
          fi
      - run: python -m pip install numpy trimesh
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix authoritative-node --ignore-scripts
      - run: npm test --prefix authoritative-node
      - run: npm install --prefix multiplayer-worker --ignore-scripts
      - run: npm test --prefix multiplayer-worker
      - run: npm run check --prefix multiplayer-worker
      - run: cd multiplayer-worker && npx wrangler deploy --dry-run
      - name: Record staging benchmark identity
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "production_warmup_ticks=600"
          } > authoritative-node-benchmark-identity.txt
      - name: Run staging production-warmed 36000-tick hard gate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        id: staging_benchmark
        shell: bash
        run: |
          set +e
          node scripts/benchmark-authoritative-node.mjs \
            --output=authoritative-node-local-benchmark.json
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture failed-gate scheduler evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging' && steps.staging_benchmark.outputs.status != '0'
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "nproc=$(nproc)"
            echo "production_warmup_ticks=600"
            echo "=== uptime ==="
            uptime
            echo "=== cpu pressure ==="
            cat /proc/pressure/cpu 2>/dev/null || true
            echo "=== runnable processes ==="
            ps -eo pid,ppid,psr,pcpu,pmem,stat,comm,args --sort=-pcpu | head -n 40 || true
          } > authoritative-node-benchmark-scheduler.txt

          set +e
          node scripts/benchmark-authoritative-node.mjs \
            --diagnostics \
            --slow-tick-threshold-ms=5 \
            --output=authoritative-node-local-benchmark-diagnostic.json
          diagnostic_status=$?
          echo "diagnostic_exit_status=${diagnostic_status}" >> authoritative-node-benchmark-scheduler.txt
          exit 0
      - name: Upload staging benchmark evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-local-benchmark
          path: |
            authoritative-node-local-benchmark.json
            authoritative-node-local-benchmark-diagnostic.json
            authoritative-node-benchmark-identity.txt
            authoritative-node-benchmark-scheduler.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce staging benchmark hard gate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        shell: bash
        run: exit "${{ steps.staging_benchmark.outputs.status }}"
      - name: Smoke real staging Node startup on loopback
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          SERVICE_LOG="${RUNNER_TEMP}/authoritative-node-loopback.log"

          HOST=127.0.0.1 \
          PORT=8080 \
          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
          node authoritative-node/src/index.js >"${SERVICE_LOG}" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Node authority exited before healthz became ready" >&2
              cat "${SERVICE_LOG}" >&2
              exit 1
            fi
            sleep 0.25
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "Node authority did not become healthy after production warmup" >&2
            cat "${SERVICE_LOG}" >&2
            exit 1
          fi

          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
            npm run smoke:authoritative-node-staging -- \
              --url=ws://127.0.0.1:8080/ws \
              --room=ci-staging-smoke
      - name: Public Quick Tunnel preflight (non-gating)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          SERVICE_LOG="${RUNNER_TEMP}/authoritative-node-public.log"
          TUNNEL_LOG="${RUNNER_TEMP}/authoritative-node-quick-tunnel.log"

          HOST=127.0.0.1 \
          PORT=8080 \
          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
          node authoritative-node/src/index.js >"${SERVICE_LOG}" 2>&1 &
          SERVER_PID=$!
          TUNNEL_PID=""

          cleanup() {
            if [[ -n "${TUNNEL_PID}" ]]; then
              kill "${TUNNEL_PID}" 2>/dev/null || true
              wait "${TUNNEL_PID}" 2>/dev/null || true
            fi
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              cat "${SERVICE_LOG}" >&2
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null

          (
            cd multiplayer-worker
            npx wrangler tunnel quick-start http://127.0.0.1:8080
          ) >"${TUNNEL_LOG}" 2>&1 &
          TUNNEL_PID=$!

          PUBLIC_URL=""
          for attempt in $(seq 1 120); do
            PUBLIC_URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "${TUNNEL_LOG}" | head -n 1 || true)"
            if [[ -n "${PUBLIC_URL}" ]]; then
              break
            fi
            if ! kill -0 "${TUNNEL_PID}" 2>/dev/null; then
              echo "Quick Tunnel exited before publishing a URL" >&2
              cat "${TUNNEL_LOG}" >&2
              exit 1
            fi
            sleep 0.5
          done

          if [[ -z "${PUBLIC_URL}" ]]; then
            echo "Quick Tunnel did not publish a URL" >&2
            cat "${TUNNEL_LOG}" >&2
            exit 1
          fi
          echo "quick_tunnel_host=${PUBLIC_URL#https://}"

          public_ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent "${PUBLIC_URL}/healthz" >/dev/null 2>&1; then
              public_ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "${public_ready}" -ne 1 ]]; then
            echo "Quick Tunnel public health check failed" >&2
            cat "${TUNNEL_LOG}" >&2
            exit 1
          fi

          WSS_URL="wss://${PUBLIC_URL#https://}/ws"
          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
            npm run smoke:authoritative-node-staging -- \
              --url="${WSS_URL}" \
              --room=quick-public-smoke

          AUTHORITATIVE_BENCHMARK_TOKEN="${TOKEN}" \
          AUTHORITATIVE_BENCHMARK_COMMIT="$(git rev-parse HEAD)" \
            node scripts/loadtest-authoritative-node.mjs \
              --url="${WSS_URL}" \
              --room=quick-public-60s \
              --clients=8 \
              --seconds=60
