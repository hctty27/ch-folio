name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test packages/authoritative-physics/test/*.test.mjs
      - name: Reject deterministic expectation updates in CI
        run: |
          if UPDATE_EXPECTED=1 npm run test:authoritative-scenarios; then
            echo "scenario updater unexpectedly succeeded in CI"
            exit 1
          fi
      - run: python -m pip install numpy trimesh
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix authoritative-node --ignore-scripts
      - run: npm test --prefix authoritative-node
      - run: npm install --prefix multiplayer-worker --ignore-scripts
      - run: npm test --prefix multiplayer-worker
      - run: npm run check --prefix multiplayer-worker
      - run: cd multiplayer-worker && npx wrangler deploy --dry-run
      - name: Record staging benchmark identity
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > authoritative-node-benchmark-identity.txt
      - name: Run staging 36000-tick hard gate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        id: staging_benchmark
        shell: bash
        run: |
          set +e
          npm run benchmark:authoritative:local -- \
            --output=authoritative-node-local-benchmark.json
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture failed-gate scheduler evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging' && steps.staging_benchmark.outputs.status != '0'
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "nproc=$(nproc)"
            echo "=== uptime ==="
            uptime
            echo "=== cpu pressure ==="
            cat /proc/pressure/cpu 2>/dev/null || true
            echo "=== runnable processes ==="
            ps -eo pid,ppid,psr,pcpu,pmem,stat,comm,args --sort=-pcpu | head -n 40 || true
          } > authoritative-node-benchmark-scheduler.txt

          set +e
          npm run benchmark:authoritative:local -- \
            --diagnostics \
            --slow-tick-threshold-ms=5 \
            --output=authoritative-node-local-benchmark-diagnostic.json
          diagnostic_status=$?
          echo "diagnostic_exit_status=${diagnostic_status}" >> authoritative-node-benchmark-scheduler.txt
          exit 0
      - name: Upload staging benchmark evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        uses: actions/upload-artifact@v4
        with:
          name: node-authoritative-local-benchmark
          path: |
            authoritative-node-local-benchmark.json
            authoritative-node-local-benchmark-diagnostic.json
            authoritative-node-benchmark-identity.txt
            authoritative-node-benchmark-scheduler.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce staging benchmark hard gate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-authoritative-staging'
        shell: bash
        run: exit "${{ steps.staging_benchmark.outputs.status }}"
