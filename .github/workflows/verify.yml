name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/authoritative-physics-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-server-exclusive
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact implementation head to staging
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_HEAD=c067f2b0ad33caeeb8ef7a520a32f5c2cc7be456
          git fetch --no-tags --depth=1 origin "${IMPLEMENTATION_HEAD}"
          git checkout --detach "${IMPLEMENTATION_HEAD}"
          test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_HEAD}"

          cleanup() {
            sudo systemctl stop ch-folio-authoritative-node.service 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo bash ops/authoritative-node/install-staging.sh
          sudo systemctl start ch-folio-authoritative-node.service

          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > staging-loopback-health.json; then
              ready=1
              break
            fi
            if ! sudo systemctl is-active --quiet ch-folio-authoritative-node.service; then
              sudo systemctl status ch-folio-authoritative-node.service --no-pager >&2 || true
              sudo journalctl -u ch-folio-authoritative-node.service -n 100 --no-pager >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "staging service did not become healthy" >&2
            sudo journalctl -u ch-folio-authoritative-node.service -n 100 --no-pager >&2 || true
            exit 1
          fi

          curl --fail --silent --show-error https://hk-test.testnb.me/healthz > staging-public-health.json
          grep -q '"protocolVersion":2' staging-loopback-health.json
          grep -q '"protocolVersion":2' staging-public-health.json

          {
            echo "implementation_head=${IMPLEMENTATION_HEAD}"
            echo "installed_root=/opt/ch-folio-authoritative-staging"
            echo "service=ch-folio-authoritative-node.service"
            echo "loopback_health=$(cat staging-loopback-health.json)"
            echo "public_health=$(cat staging-public-health.json)"
            echo "post_validation_service_state=stopped_for_named_acceptance"
          } > staging-deploy-identity.txt
      - name: Upload staging deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task9-staging-deploy
          path: |
            staging-loopback-health.json
            staging-public-health.json
            staging-deploy-identity.txt
          if-no-files-found: error
          retention-days: 30
